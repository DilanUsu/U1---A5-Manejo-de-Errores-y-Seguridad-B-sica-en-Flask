{% extends 'base.html' %}
{% block title %}Error 500 · Videojuegos{% endblock %}
{% block content %}
<div class="error-box has-text-centered">
  <p class="error-code has-text-danger">500</p>
  <h1 class="title">Error interno del servidor</h1>
  <p class="subtitle">Ocurrió un problema inesperado. El error ya quedó registrado y lo revisaremos.</p>
  <p class="has-text-grey">Intenta de nuevo en unos minutos.</p>
  <a class="button is-primary mt-4" href="{{ url_for('inicio') }}">Volver al catálogo</a>
</div>
{% endblock %}
